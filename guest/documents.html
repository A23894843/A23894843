<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruiter Documents — Abhinandan</title>
<style>:root{--bg:#080b10;--p:#10151c;--i:#eef4f5;--m:#8b97a7;--l:#27323e;--t:#42e3c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:15px/1.6 Arial}.w{width:min(calc(100% - 30px),1050px);margin:auto}.top{height:76px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between}.brand{font:600 14px monospace}.brand b{color:var(--t)}a{color:inherit;text-decoration:none}.btn{display:inline-block;border:1px solid var(--l);background:var(--p);padding:11px 14px;border-radius:9px;font:11px monospace}.primary{background:var(--i);color:var(--bg)}.hero{padding:70px 0 35px}.ey{font:11px monospace;letter-spacing:.15em;color:var(--m)}.hero h1{font:600 clamp(45px,7vw,82px);line-height:.95;margin:12px 0}.hero p{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding-bottom:80px}.card{border:1px solid var(--l);background:var(--p);border-radius:18px;padding:25px}.meta{font:10px monospace;color:var(--m)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.note{border:1px dashed var(--l);padding:12px;border-radius:10px;color:var(--m);font-size:12px;margin-top:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><header class="top"><div class="w"><a class="brand" href="/">ABHINANDAN<b>_</b></a><a class="btn" href="/">← Portfolio</a></div></header>
<main class="w"><div class="hero"><div class="ey">PUBLIC / RECRUITER DOCUMENT ROOM</div><h1>Professional<br>Documents.</h1><p>Preview CVs, project reports and certificates without creating an account.</p><div class="note">Preview/download permissions are enforced by the document service. Browser preview cannot provide absolute DRM.</div></div><div id="docs" class="grid"><div class="card">Loading…</div></div></main>
<script>async function load(){try{let r=await fetch('/api/documents');let d=await r.json();docs.innerHTML=d.map(x=>'<article class="card"><div style="color:var(--t);font:10px monospace">● AVAILABLE</div><h2>'+esc(x.title)+'</h2><div class="meta">'+esc(x.type).toUpperCase()+' · '+(x.download?'PREVIEW + DOWNLOAD':'PREVIEW ONLY')+'</div><div class="actions"><a class="btn primary" target="_blank" href="/api/documents?id='+encodeURIComponent(x.id)+'&mode=preview">PREVIEW ↗</a>'+(x.download?'<a class="btn" href="/api/documents?id='+encodeURIComponent(x.id)+'&mode=download">DOWNLOAD</a>':'')+'</div></article>').join('')||'<div class="card">No public documents published yet.</div>'}catch(e){docs.innerHTML='<div class="card">Document service is not configured yet.</div>'}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load()</script></body></html>
