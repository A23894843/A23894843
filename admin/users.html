<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Management — Abhinandan</title><link rel="stylesheet" href="/assets/theme-system.css"><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/theme-system.js"></script></head><body><main class="page"><header class="top"><a class="brand" href="/admin/dashboard.html">ABHINANDAN<b>_</b></a><nav class="nav"><a class="btn" href="/admin/dashboard.html">DASHBOARD</a><a class="btn" href="/admin/profile.html">PROFILE</a><a class="btn" href="/admin/documents.html">DOCUMENTS</a><a class="btn" href="/admin/queries.html">QUERIES</a><a class="btn" href="/admin/audit.html">AUDIT</a><button class="btn" id="logoutBtn">LOGOUT</button></nav></header><section class="card"><div class="split"><div><div class="ey">ADMIN / USER CONTROL</div><h1 class="title">Approve & assign.</h1><p class="muted">Approve pending accounts, suspend access and assign granular permissions.</p></div><button class="btn" id="refresh" type="button">REFRESH</button></div><div id="msg" class="msg"></div><div class="table-wrap"><table class="table"><thead><tr><th>USER</th><th>STATUS</th><th>ROLE</th><th>PERMISSIONS</th><th>ACTIONS</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main><div class="modal" id="modal"><div class="modal-card"><button class="btn close" id="close" type="button">CLOSE</button><div class="ey">PERMISSION EDITOR</div><h2 id="modalTitle">Permissions</h2><div class="checkgrid" id="checks"></div><div class="actions"><button class="btn primary" id="savePerms" type="button">SAVE PERMISSIONS</button></div><div id="permMsg" class="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/auth.js"></script><script>
const rows=document.getElementById('rows'),msg=document.getElementById('msg'),modal=document.getElementById('modal'),checks=document.getElementById('checks'),refreshBtn=document.getElementById('refresh'),logoutBtn=document.getElementById('logoutBtn'),permissions=['VIEW_DASHBOARD','MANAGE_PROFILE','MANAGE_DOCUMENTS','VIEW_QUERIES','REPLY_QUERIES','MANAGE_ADMINS','APPROVE_ADMINS','VIEW_AUDIT_LOG'];let users=[],editing=null;
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));}
async function token(){return (await sb.auth.getSession()).data.session?.access_token||'';}
async function load(){
  rows.innerHTML='<tr><td colspan="5">Loading…</td></tr>';msg.textContent='';
  if(!await requirePermission('MANAGE_ADMINS'))return;
  try{const response=await fetch('/api/admin/users',{headers:{Authorization:`Bearer ${await token()}`}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Unable to load administrators.');users=data.users||[];
    rows.innerHTML=users.length?users.map(user=>`<tr><td><b>${esc(user.display_name||'Unnamed')}</b><br><span class="muted">${esc(user.email)}</span></td><td><span class="badge ${esc(user.status)}">${esc(user.status)}</span></td><td>${esc(user.role)}</td><td>${user.role==='owner'?'<span class="badge approved">ALL</span>':(user.permissions||[]).map(p=>`<span class="badge">${esc(p)}</span>`).join(' ')||'<span class="muted">none</span>'}</td><td>${user.status==='pending'?`<button class="btn primary small" onclick="statusOf('${user.id}','approved')">APPROVE</button> `:''}${user.status==='approved'?`<button class="btn danger small" onclick="statusOf('${user.id}','suspended')">SUSPEND</button> `:''}${user.status==='suspended'?`<button class="btn primary small" onclick="statusOf('${user.id}','approved')">RESTORE</button> `:''}${user.status!=='rejected'?`<button class="btn small" onclick="statusOf('${user.id}','rejected')">REJECT</button> `:''}${user.role!=='owner'?`<button class="btn small" onclick="edit('${user.id}')">PERMISSIONS</button>`:''}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No admin accounts found.</div></td></tr>';
  }catch(error){rows.innerHTML=`<tr><td colspan="5"><div class="empty">${esc(error.message||'Unable to load administrators.')}</div></td></tr>`;msg.textContent=error.message||'Unable to load administrators.';msg.className='msg error';}
}
async function statusOf(id,status){
  try{const response=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${await token()}`},body:JSON.stringify({action:'status',user_id:id,status})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Unable to update account.');msg.textContent=`Account ${status}.`;msg.className='msg success';await load();}catch(error){msg.textContent=error.message||'Unable to update account.';msg.className='msg error';}
}
function edit(id){editing=users.find(user=>user.id===id);if(!editing)return;modal.classList.add('open');document.getElementById('modalTitle').textContent=`Permissions — ${editing.display_name||editing.email}`;checks.innerHTML=permissions.map(permission=>`<label class="check"><input type="checkbox" value="${permission}" ${(editing.permissions||[]).includes(permission)?'checked':''}> ${permission}</label>`).join('');document.getElementById('permMsg').textContent='';}
document.getElementById('savePerms').onclick=async()=>{if(!editing)return;const selected=[...checks.querySelectorAll('input:checked')].map(input=>input.value),button=document.getElementById('savePerms');button.disabled=true;document.getElementById('permMsg').textContent='Saving…';try{const response=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${await token()}`},body:JSON.stringify({action:'permissions',user_id:editing.id,permissions:selected})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Unable to save permissions.');document.getElementById('permMsg').textContent='Permissions saved.';setTimeout(()=>{modal.classList.remove('open');load();},350);}catch(error){document.getElementById('permMsg').textContent=error.message||'Unable to save permissions.';}finally{button.disabled=false;}};
document.getElementById('close').onclick=()=>modal.classList.remove('open');refreshBtn.onclick=load;logoutBtn.onclick=()=>logout();load();
</script></body></html>
