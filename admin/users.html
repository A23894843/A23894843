<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Management — Abhinandan</title><link rel="stylesheet" href="/assets/theme-system.css"><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/theme-system.js"></script></head><body><main class="page"><header class="top"><a class="brand" href="/admin/dashboard.html">ABHINANDAN<b>_</b></a><nav class="nav"><a class="btn" href="/admin/dashboard.html">DASHBOARD</a><a class="btn" href="/admin/queries.html">QUERIES</a><button class="btn" id="logout">LOGOUT</button></nav></header><section class="card"><div class="split"><div><div class="ey">ADMIN / USER CONTROL</div><h1 class="title">Approve & assign.</h1><p class="muted">Only accounts with the appropriate permissions can approve users or change permissions.</p></div><button class="btn" id="refresh">REFRESH</button></div><div id="msg" class="msg"></div><div class="table-wrap"><table class="table"><thead><tr><th>USER</th><th>STATUS</th><th>ROLE</th><th>PERMISSIONS</th><th>ACTIONS</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main><div class="modal" id="modal"><div class="modal-card"><button class="btn close" id="close">CLOSE</button><div class="ey">PERMISSION EDITOR</div><h2 id="modalTitle">Permissions</h2><div class="checkgrid" id="checks"></div><div class="actions"><button class="btn primary" id="savePerms">SAVE PERMISSIONS</button></div><div id="permMsg" class="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/auth.js"></script><script>const rows=document.getElementById('rows'),msg=document.getElementById('msg'),modal=document.getElementById('modal'),checks=document.getElementById('checks');let users=[],editing=null;const permissions=['VIEW_DASHBOARD','MANAGE_PROFILE','MANAGE_DOCUMENTS','VIEW_QUERIES','REPLY_QUERIES','MANAGE_ADMINS','APPROVE_ADMINS','VIEW_AUDIT_LOG'];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function token(){return (await sb.auth.getSession()).data.session?.access_token||''}async function load(){if(!await requirePermission('MANAGE_ADMINS'))return;const r=await fetch('/api/admin/users',{headers:{Authorization:`Bearer ${await token()}`}});const d=await r.json();if(!r.ok){msg.textContent=d.error;return}users=d.users||[];rows.innerHTML=users.map(u=>`<tr><td><b>${esc(u.display_name||'Unnamed')}</b><br><span class="muted">${esc(u.email)}</span></td><td><span class="badge ${u.status}">${esc(u.status)}</span></td><td>${esc(u.role)}</td><td>${u.role==='owner'?'<span class="badge approved">ALL</span>':(u.permissions||[]).map(p=>`<span class="badge">${esc(p)}</span>`).join(' ')||'<span class="muted">none</span>'}</td><td>${u.status==='pending'?`<button class="btn primary small" onclick="statusOf('${u.id}','approved')">APPROVE</button> `:''}${u.status!=='disabled'?`<button class="btn danger small" onclick="statusOf('${u.id}','disabled')">DISABLE</button>`:''} ${u.role!=='owner'?`<button class="btn small" onclick="edit('${u.id}')">PERMISSIONS</button>`:''}</td></tr>`).join('')}async function statusOf(id,status){const r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${await token()}`},body:JSON.stringify({action:'status',user_id:id,status})});const d=await r.json();msg.textContent=d.error||`User ${status}.`;msg.className=`msg ${r.ok?'success':'error'}`;load()}function edit(id){editing=users.find(x=>x.id===id);if(!editing)return;modal.classList.add('open');document.getElementById('modalTitle').textContent=`Permissions — ${editing.display_name||editing.email}`;checks.innerHTML=permissions.map(p=>`<label class="check"><input type="checkbox" value="${p}" ${(editing.permissions||[]).includes(p)?'checked':''}> ${p}</label>`).join('')}document.getElementById('permMsg').textContent=''}document.getElementById('savePerms').onclick=async()=>{const selected=[...checks.querySelectorAll('input:checked')].map(x=>x.value);const r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${await token()}`},body:JSON.stringify({action:'permissions',user_id:editing.id,permissions:selected})});const d=await r.json();document.getElementById('permMsg').textContent=d.error||'Permissions saved.';if(r.ok){setTimeout(()=>{modal.classList.remove('open');load()},500)}};document.getElementById('close').onclick=()=>modal.classList.remove('open');refresh.onclick=load;logout.onclick=()=>logout();load();</script></body></html>
