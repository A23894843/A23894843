<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Documents</title><style>:root{--bg:#080b10;--p:#10151c;--i:#eef4f5;--m:#8b97a7;--l:#27323e;--t:#42e3c4;--r:#ff7777}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--i);font:14px/1.6 Arial;display:grid;place-items:center}.w{width:min(calc(100% - 30px),500px)}.top{display:flex;justify-content:space-between;margin-bottom:18px}.brand{font:600 14px monospace}.brand b{color:var(--t)}a{color:inherit;text-decoration:none}.card{border:1px solid var(--l);background:var(--p);border-radius:20px;padding:30px}.ey{font:10px monospace;letter-spacing:.15em;color:var(--m)}h1{font:600 40px/1 Arial;margin:10px 0}.sub{color:var(--m);font-size:13px}.f{margin-top:16px}.f label{display:block;font:10px monospace;color:var(--m);margin-bottom:5px}.f input{width:100%;padding:12px;border:1px solid var(--l);background:var(--bg);color:var(--i);border-radius:9px}.btn{border:1px solid var(--l);background:var(--p);color:var(--i);padding:11px 14px;border-radius:9px;cursor:pointer;font:11px monospace}.primary{background:var(--t);color:#03120f;border-color:var(--t)}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px}.msg{min-height:20px;color:var(--r);font-size:12px;margin-top:10px}.fine{color:var(--m);font-size:11px;margin-top:17px}</style><style>.w{width:min(calc(100% - 30px),1050px);margin:30px auto}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}.item{border:1px solid var(--l);padding:13px;border-radius:10px;margin-top:9px;display:flex;justify-content:space-between;gap:8px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="top"><div><a class="brand" href="/">ABHINANDAN<b>_</b></a><div class="ey">ADMIN / DOCUMENT CONTROL</div></div><div><a class="btn" href="/guest/documents.html">GUEST</a> <button class="btn" onclick="logout()">LOGOUT</button></div></div><div id="gate" class="card">Checking authorization…</div><div id="app" class="grid" style="display:none"><section class="card"><div class="ey">UPLOAD</div><h1 style="font-size:30px">Publish document.</h1><form id="upload"><div class="f"><label>TITLE</label><input id="title" required></div><div class="f"><label>TYPE</label><select id="type"><option value="cv">CV</option><option value="report">Project report</option><option value="certificate">Certificate</option></select></div><div class="f"><label>FILE</label><input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg" required></div><div class="f"><label>DOWNLOAD</label><select id="dl"><option value="false">Preview only</option><option value="true">Preview + download</option></select></div><div class="actions"><button class="btn primary">PUBLISH</button></div><div id="msg" class="msg"></div></form></section><section class="card"><div class="ey">LIBRARY</div><h1 style="font-size:30px">Published.</h1><div id="list">Loading…</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/auth.js"></script><script>
async function boot(){if(await guard()){gate.style.display="none";app.style.display="grid";load()}}async function load(){let d=await docs();list.innerHTML=d.map(x=>'<div class="item"><span><b>'+esc(x.title)+'</b><br><small>'+esc(x.type)+' · '+(x.download_allowed?"preview + download":"preview only")+'</small></span><button class="btn" onclick="removeIt(\''+x.id+'\',\''+esc(x.storage_path)+'\')">DELETE</button></div>').join("")||"No documents."}upload.onsubmit=async e=>{e.preventDefault();try{msg.textContent="Uploading…";await uploadDoc(title.value,type.value,file.files[0],dl.value==="true");upload.reset();msg.textContent="Published.";load()}catch(x){msg.textContent=x.message}}async function removeIt(id,p){if(!confirm("Delete this document?"))return;try{await deleteDoc(id,p);load()}catch(x){alert(x.message)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}boot()</script></body></html>
