<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Log — Abhinandan</title>
<link rel="stylesheet" href="/assets/theme-system.css">
<link rel="stylesheet" href="/assets/admin.css">
<script src="/assets/theme-system.js"></script>
</head>

<body>
<main class="page">
  <header class="top">
    <a class="brand" href="/admin/dashboard.html">ABHINANDAN<b>_</b></a>
    <nav class="nav">
      <a class="btn" href="/admin/dashboard.html">DASHBOARD</a>
      <button class="btn" id="logoutBtn" type="button">LOGOUT</button>
    </nav>
  </header>

  <section class="card">
    <div class="split">
      <div>
        <div class="ey">SECURITY / AUDIT</div>
        <h1 class="title">Audit trail.</h1>
        <p class="muted">Administrative actions are recorded for accountability.</p>
      </div>
      <button class="btn" id="refreshBtn" type="button">REFRESH</button>
    </div>

    <div id="status" class="msg" style="margin-top:16px"></div>

    <div class="table-wrap" style="margin-top:18px">
      <table class="table">
        <thead>
          <tr>
            <th>TIME</th>
            <th>ADMIN</th>
            <th>ACTION</th>
            <th>TARGET</th>
            <th>METADATA</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="5">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/config.js"></script>
<script src="/admin/auth.js"></script>

<script>
const rows = document.getElementById('rows');
const statusEl = document.getElementById('status');
const refreshBtn = document.getElementById('refreshBtn');
const logoutBtn = document.getElementById('logoutBtn');

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[char]));
}

function setStatus(message, type='') {
  statusEl.textContent = message || '';
  statusEl.className = `msg ${type}`.trim();
}

function renderLogs(logs) {
  if (!Array.isArray(logs) || logs.length === 0) {
    rows.innerHTML = '<tr><td colspan="5">No audit entries yet.</td></tr>';
    return;
  }

  rows.innerHTML = logs.map(log => {
    const metadata = log.metadata && typeof log.metadata === 'object'
      ? JSON.stringify(log.metadata)
      : String(log.metadata ?? '');

    return `
      <tr>
        <td>${esc(new Date(log.created_at).toLocaleString('en-IN'))}</td>
        <td>
          <code>${esc(log.admin_id || '—')}</code>
        </td>
        <td><b>${esc(log.action)}</b></td>
        <td>
          ${esc(log.target_type || '—')}
          ${log.target_id ? `<br><code>${esc(log.target_id)}</code>` : ''}
        </td>
        <td><code>${esc(metadata)}</code></td>
      </tr>
    `;
  }).join('');
}

async function getToken() {
  if (!window.sb) throw new Error('Supabase client is not initialized.');
  const sessionResult = await sb.auth.getSession();
  const token = sessionResult?.data?.session?.access_token;
  if (!token) throw new Error('Your admin session has expired. Please sign in again.');
  return token;
}

async function loadAudit() {
  rows.innerHTML = '<tr><td colspan="5">Loading…</td></tr>';
  setStatus('');
  refreshBtn.disabled = true;

  try {
    if (!await requirePermission('VIEW_AUDIT_LOG')) {
      return;
    }

    const token = await getToken();

    const response = await fetch('/api/admin/audit', {
      method: 'GET',
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/json'
      },
      cache: 'no-store'
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || `Audit API returned HTTP ${response.status}.`);
    }

    renderLogs(data.logs || []);
    setStatus(`${(data.logs || []).length} audit entr${(data.logs || []).length === 1 ? 'y' : 'ies'} loaded.`, 'success');
  } catch (error) {
    console.error('Audit log loading failed:', error);
    rows.innerHTML = `
      <tr>
        <td colspan="5">
          <strong>Unable to load audit log.</strong><br>
          <span class="muted">${esc(error?.message || 'Unknown error.')}</span>
        </td>
      </tr>
    `;
    setStatus(error?.message || 'Unable to load audit log.', 'error');
  } finally {
    refreshBtn.disabled = false;
  }
}

refreshBtn.addEventListener('click', loadAudit);
logoutBtn.addEventListener('click', () => logout());

loadAudit();
</script>
</body>
</html>
