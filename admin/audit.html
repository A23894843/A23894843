<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log — Abhinandan</title><link rel="stylesheet" href="/assets/theme-system.css"><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/theme-system.js"></script></head><body><main class="page"><header class="top"><a class="brand" href="/admin/dashboard.html">ABHINANDAN<b>_</b></a><nav class="nav"><a class="btn" href="/admin/dashboard.html">DASHBOARD</a><button class="btn" id="logout">LOGOUT</button></nav></header><section class="card"><div class="split"><div><div class="ey">SECURITY / AUDIT</div><h1 class="title">Audit trail.</h1><p class="muted">Administrative actions are recorded for accountability.</p></div><button class="btn" id="refresh">REFRESH</button></div><div class="table-wrap" style="margin-top:18px"><table class="table"><thead><tr><th>TIME</th><th>ACTION</th><th>TARGET</th><th>METADATA</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody></table></div><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/auth.js"></script><script>function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])}async function load(){if(!await requirePermission('VIEW_AUDIT_LOG'))return;const s=(await sb.auth.getSession()).data.session;const r=await fetch('/api/admin/audit',{headers:{Authorization:`Bearer ${s?.access_token||''}`}});const d=await r.json();if(!r.ok){msg.textContent=d.error;return}rows.innerHTML=(d.logs||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('en-IN')}</td><td><b>${esc(x.action)}</b></td><td>${esc(x.target_type||'')}<br>${esc(x.target_id||'')}</td><td><code>${esc(JSON.stringify(x.metadata||{}))}</code></td></tr>`).join('')||'<tr><td colspan="4">No audit entries.</td></tr>'}refresh.onclick=load;logout.onclick=()=>logout();load();</script></body></html>
