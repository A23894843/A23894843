<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Abhinandan</title><link rel="stylesheet" href="/assets/theme-system.css"><script src="/assets/theme-system.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><script src="/assets/turnstile-config.js"></script><script src="/assets/admin-security.js"></script><style>:root{--bg:#080b10;--panel:#10151c;--text:#eef4f5;--muted:#8b97a7;--border:#27323e;--t:#42e3c4;--r:#ff7777}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,rgba(66,227,196,.08),transparent 35%),var(--bg);color:var(--text);font:14px/1.6 Inter,Arial,sans-serif;padding:20px}.wrap{width:min(100%,500px)}.top{display:flex;justify-content:space-between;margin-bottom:18px}.brand{font:600 14px monospace;text-decoration:none}.brand b{color:var(--t)}.top a:last-child{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:32px}.ey{font:10px monospace;letter-spacing:.15em;color:var(--muted)}h1{font:600 42px/1.05 Arial;margin:10px 0}.sub{color:var(--muted)}.field{margin-top:17px}.field label{display:block;font:10px monospace;color:var(--muted);margin-bottom:6px}input{width:100%;padding:12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:9px;outline:none}input:focus{border-color:var(--t)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:9px;cursor:pointer;font:11px monospace;text-decoration:none}.primary{background:var(--t);color:#03120f;border-color:var(--t)}.msg{min-height:22px;margin-top:12px;color:var(--muted);font-size:12px}.success{color:var(--t)}.message{color:var(--r)}.captcha{margin-top:18px}.captcha-note{color:var(--muted);font:11px monospace;border:1px dashed var(--border);padding:10px;border-radius:9px}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="/">ABHINANDAN<b>_</b></a><a href="/admin/signup.html">REQUEST ACCESS →</a></div><section class="card"><div class="ey">PRIVATE / ADMIN ACCESS</div><h1>Sign in.</h1><p class="sub">Approved administrators only. New registrations require approval.</p><form id="form"><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><div class="captcha" id="captcha" data-turnstile-widget></div><div class="actions"><button id="submit" class="btn primary" type="submit">SIGN IN →</button><a class="btn" href="/admin/forgot-password.html">FORGOT PASSWORD</a></div><div id="msg" class="msg" aria-live="polite"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/auth.js"></script><script>const form=document.getElementById('form'),email=document.getElementById('email'),password=document.getElementById('password'),button=document.getElementById('submit'),msg=document.getElementById('msg');AdminSecurity.render('captcha','login');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';button.disabled=true;button.textContent='SIGNING IN...';try{const ok=await login(email.value,password.value,AdminSecurity.getToken());if(!ok)msg.textContent='Sign-in was not completed.'}catch(error){msg.textContent=error.message||'Unable to sign in.'}finally{AdminSecurity.reset();button.disabled=false;button.textContent='SIGN IN →';AdminSecurity.render('captcha','login')}});</script></body></html>
