<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Login — Abhinandan</title>

    <style>
        :root {
            --bg: #080b10;
            --panel: #10151c;
            --input: #080b10;

            --text: #eef4f5;
            --muted: #8b97a7;
            --border: #27323e;

            --teal: #42e3c4;
            --red: #ff7777;

            --shadow: rgba(0, 0, 0, .35);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: grid;
            place-items: center;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(66, 227, 196, .08),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                Arial,
                sans-serif;

            font-size: 14px;
            line-height: 1.6;

            padding: 20px;
        }

        /* =========================================
           PAGE
        ========================================= */

        .wrapper {
            width: min(100%, 500px);
        }

        /* =========================================
           TOP BAR
        ========================================= */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;

            gap: 15px;
        }

        .brand {
            color: var(--text);

            font-family: monospace;
            font-size: 14px;
            font-weight: 600;

            text-decoration: none;
            letter-spacing: .02em;
        }

        .brand b {
            color: var(--teal);
        }

        .portfolio-link {
            color: var(--muted);

            font-size: 12px;

            text-decoration: none;

            transition:
                color .2s ease,
                transform .2s ease;
        }

        .portfolio-link:hover {
            color: var(--teal);
            transform: translateX(-2px);
        }

        /* =========================================
           CARD
        ========================================= */

        .card {
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.015),
                    rgba(255,255,255,0)
                ),
                var(--panel);

            border: 1px solid var(--border);

            border-radius: 22px;

            padding: 32px;

            box-shadow:
                0 25px 80px var(--shadow);

            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--teal),
                    transparent
                );

            opacity: .6;
        }

        /* =========================================
           HEADER
        ========================================= */

        .eyebrow {
            color: var(--muted);

            font-family: monospace;
            font-size: 10px;

            letter-spacing: .16em;

            text-transform: uppercase;
        }

        h1 {
            margin: 10px 0 10px;

            font-size: clamp(38px, 8vw, 54px);

            line-height: .95;

            letter-spacing: -.055em;

            font-weight: 600;
        }

        .subtitle {
            margin: 0;

            color: var(--muted);

            font-size: 13px;
        }

        /* =========================================
           FORM
        ========================================= */

        .field {
            margin-top: 20px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            color: var(--muted);

            font-family: monospace;
            font-size: 10px;

            letter-spacing: .08em;
        }

        .field input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: var(--input);

            color: var(--text);

            outline: none;

            font-size: 14px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .field input::placeholder {
            color: #536071;
        }

        .field input:focus {
            border-color: var(--teal);

            box-shadow:
                0 0 0 3px rgba(66, 227, 196, .08);
        }

        /* =========================================
           PASSWORD ACTION
        ========================================= */

        .password-tools {
            display: flex;

            justify-content: flex-end;

            margin-top: 8px;
        }

        .forgot-link {
            color: var(--muted);

            font-family: monospace;
            font-size: 10px;

            text-decoration: none;

            transition: color .2s ease;
        }

        .forgot-link:hover {
            color: var(--teal);
        }

        /* =========================================
           BUTTONS
        ========================================= */

        .actions {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 9px;

            margin-top: 22px;
        }

        .btn {
            min-height: 44px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);

            border-radius: 10px;

            padding: 10px 14px;

            background: var(--panel);

            color: var(--text);

            font-family: monospace;
            font-size: 10px;

            cursor: pointer;

            text-decoration: none;

            transition:
                transform .2s ease,
                border-color .2s ease,
                background .2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--teal);
        }

        .primary {
            background: var(--teal);

            color: #03120f;

            border-color: var(--teal);

            font-weight: 600;
        }

        .primary:hover {
            background: #55e8ce;
        }

        /* =========================================
           SECONDARY LINKS
        ========================================= */

        .secondary-actions {
            display: flex;

            justify-content: center;

            gap: 8px;

            margin-top: 10px;
        }

        .secondary-actions .btn {
            flex: 1;
        }

        /* =========================================
           MESSAGE
        ========================================= */

        .msg {
            min-height: 22px;

            margin-top: 14px;

            color: var(--red);

            font-size: 12px;

            text-align: center;
        }

        .msg.success {
            color: var(--teal);
        }

        /* =========================================
           INFO
        ========================================= */

        .fine {
            margin-top: 22px;

            padding-top: 18px;

            border-top: 1px solid var(--border);

            color: var(--muted);

            font-size: 11px;

            text-align: center;
        }

        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 17px;

            color: var(--muted);

            font-family: monospace;
            font-size: 10px;
        }

        .footer a {
            color: var(--muted);

            text-decoration: none;

            transition: color .2s ease;
        }

        .footer a:hover {
            color: var(--teal);
        }

        .separator {
            opacity: .4;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 520px) {

            body {
                padding: 14px;
            }

            .card {
                padding: 25px 21px;
                border-radius: 18px;
            }

            h1 {
                font-size: 40px;
            }

            .actions {
                grid-template-columns: 1fr;
            }

            .secondary-actions {
                flex-direction: column;
            }

            .topbar {
                padding: 0 2px;
            }
        }
    </style>
    <link rel="stylesheet" href="/assets/theme-system.css">
    <script src="/assets/theme-system.js"></script>
</head>

<body>

<main class="wrapper">

    <!-- =========================================
         TOP NAVIGATION
    ========================================== -->

    <div class="topbar">

        <a
            class="brand"
            href="/"
        >
            ABHINANDAN<b>_</b>
        </a>

        <a
            class="portfolio-link"
            href="/"
        >
            ← PORTFOLIO
        </a>

    </div>


    <!-- =========================================
         LOGIN CARD
    ========================================== -->

    <section class="card">

        <div class="eyebrow">
            PRIVATE / ADMIN
        </div>

        <h1>
            Welcome back.
        </h1>

        <p class="subtitle">
            Sign in to manage recruiter documents.
        </p>


        <!-- =====================================
             LOGIN FORM
        ====================================== -->

        <form id="form">

            <div class="field">

                <label for="email">
                    EMAIL
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="admin@example.com"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >


                <div class="password-tools">

                    <a
                        class="forgot-link"
                        href="/admin/forgot-password.html"
                    >
                        FORGOT PASSWORD?
                    </a>

                </div>

            </div>


            <!-- =================================
                 PRIMARY ACTIONS
            ================================== -->

            <div class="actions">

                <button
                    class="btn primary"
                    type="submit"
                >
                    SIGN IN →
                </button>

                <a
                    class="btn"
                    href="/admin/signup.html"
                >
                    SIGN UP
                </a>

            </div>


            <div
                id="msg"
                class="msg"
                aria-live="polite"
            ></div>

        </form>


        <!-- =====================================
             INFORMATION
        ====================================== -->

        <div class="fine">

            Admin access requires an approved account.
            New registrations remain pending until approved.

        </div>

    </section>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <div class="footer">

        <a
            href="https://www.linkedin.com/in/abhinandan-29b66b28b/"
            target="_blank"
            rel="noopener noreferrer"
        >
            LINKEDIN ↗
        </a>

        <span class="separator">·</span>

        <a href="/">
            PORTFOLIO
        </a>

    </div>

</main>


<!-- =========================================
     SUPABASE
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!--
    IMPORTANT:
    Do not modify this file here.
    Your existing config.js remains responsible
    for SUPABASE_URL and SUPABASE_ANON_KEY.
-->

<script src="/admin/config.js"></script>


<!-- Existing authentication logic -->
<script src="/admin/auth.js"></script>


<script>

/*
 * ==============================================
 * LOGIN FORM
 * ==============================================
 */

const form =
    document.getElementById("form");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const msg =
    document.getElementById("msg");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        msg.textContent = "";

        msg.classList.remove("success");


        const emailValue =
            email.value.trim();

        const passwordValue =
            password.value;


        if (!emailValue || !passwordValue) {

            msg.textContent =
                "Enter your email and password.";

            return;
        }


        /*
         * auth.js handles:
         *
         * - Supabase authentication
         * - profile lookup
         * - admin role validation
         * - approval status
         * - redirect to documents page
         */

        await login(
            emailValue,
            passwordValue
        );

    }
);


/*
 * ==============================================
 * PASSWORD RESET SUCCESS MESSAGE
 * ==============================================
 */

const params =
    new URLSearchParams(
        window.location.search
    );


if (
    params.get("reset") === "success"
) {

    msg.textContent =
        "Password updated successfully. You can now sign in.";

    msg.classList.add("success");

}


/*
 * ==============================================
 * AUTO-FOCUS
 * ==============================================
 */

window.addEventListener(
    "load",
    function() {

        if (!email.value) {

            email.focus();

        }

    }
);

</script>

</body>
</html>
