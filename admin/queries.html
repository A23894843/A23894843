<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queries — Abhinandan</title><link rel="stylesheet" href="/assets/theme-system.css"><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/theme-system.js"></script></head><body><main class="page"><header class="top"><a class="brand" href="/admin/dashboard.html">ABHINANDAN<b>_</b></a><nav class="nav"><a class="btn" href="/admin/dashboard.html">DASHBOARD</a><a class="btn" href="/admin/profile.html">PROFILE</a><button class="btn" id="logout">LOGOUT</button></nav></header><section class="card"><div class="split"><div><div class="ey">COMMUNICATION / INBOX</div><h1 class="title">Queries.</h1><p class="muted">Public messages from the portfolio. Reply access is permission-controlled.</p></div><button class="btn" id="refresh">REFRESH</button></div><div id="list" style="margin-top:18px"></div><div id="msg" class="msg"></div></section></main><div class="modal" id="modal"><div class="modal-card"><button class="btn close" id="close">CLOSE</button><div class="ey">QUERY</div><h2 id="subject"></h2><div class="muted" id="from"></div><div class="message-box" id="body"></div><div id="replyArea"><div class="field"><label>REPLY</label><textarea class="textarea" id="reply" maxlength="8000" placeholder="Write a professional response..."></textarea></div><div class="actions"><button class="btn primary" id="send">SEND REPLY →</button><button class="btn" id="closeQuery">CLOSE QUERY</button></div><div id="replyMsg" class="msg"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/auth.js"></script><script>let queries=[],selected=null,ctx=null;const list=document.getElementById('list'),msg=document.getElementById('msg'),modal=document.getElementById('modal');async function token(){return (await sb.auth.getSession()).data.session?.access_token||''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){if(!await requirePermission('VIEW_QUERIES'))return;const r=await fetch('/api/admin/queries',{headers:{Authorization:`Bearer ${await token()}`}});const d=await r.json();if(!r.ok){msg.textContent=d.error;msg.className='msg error';return}queries=d.queries||[];list.innerHTML=queries.length?queries.map(q=>`<article class="query" onclick="openQuery('${q.id}')"><div class="query-head"><span class="query-subject">${esc(q.subject)}</span><span class="badge ${q.status==='open'?'pending':'approved'}">${esc(q.status)}</span></div><div class="muted">${esc(q.name)} · ${esc(q.email)} · ${new Date(q.created_at).toLocaleString('en-IN')}</div><div class="query-message">${esc(q.message)}</div></article>`).join(''):'<div class="empty">No queries yet.</div>'}async function openQuery(id){selected=queries.find(q=>q.id===id);if(!selected)return;subject.textContent=selected.subject;from.textContent=`${selected.name} <${selected.email}> · ${new Date(selected.created_at).toLocaleString('en-IN')}`;body.textContent=selected.message;reply.value='';replyMsg.textContent='';modal.classList.add('open');const c=await getAdminContext();ctx=c;replyArea.style.display=(c.isOwner||c.permissions.includes('REPLY_QUERIES'))?'block':'none'}send.onclick=async()=>{const text=reply.value.trim();if(!text)return;send.disabled=true;replyMsg.textContent='Sending…';const r=await fetch('/api/admin/query-reply',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${await token()}`},body:JSON.stringify({id:selected.id,message:text})});const d=await r.json();replyMsg.textContent=d.error||`Reply stored. Delivery: ${d.delivery_status}`;replyMsg.className=`msg ${r.ok?'success':'error'}`;send.disabled=false;if(r.ok){reply.value='';load()}};closeQuery.onclick=async()=>{const r=await fetch('/api/admin/queries',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${await token()}`},body:JSON.stringify({id:selected.id,status:'closed'})});if(r.ok){modal.classList.remove('open');load()}};close.onclick=()=>modal.classList.remove('open');refresh.onclick=load;logout.onclick=()=>logout();load();</script></body></html>
