<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Signup</title><style>:root{--bg:#080b10;--p:#10151c;--i:#eef4f5;--m:#8b97a7;--l:#27323e;--t:#42e3c4;--r:#ff7777}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--i);font:14px/1.6 Arial;display:grid;place-items:center}.w{width:min(calc(100% - 30px),500px)}.top{display:flex;justify-content:space-between;margin-bottom:18px}.brand{font:600 14px monospace}.brand b{color:var(--t)}a{color:inherit;text-decoration:none}.card{border:1px solid var(--l);background:var(--p);border-radius:20px;padding:30px}.ey{font:10px monospace;letter-spacing:.15em;color:var(--m)}h1{font:600 40px/1 Arial;margin:10px 0}.sub{color:var(--m);font-size:13px}.f{margin-top:16px}.f label{display:block;font:10px monospace;color:var(--m);margin-bottom:5px}.f input{width:100%;padding:12px;border:1px solid var(--l);background:var(--bg);color:var(--i);border-radius:9px}.btn{border:1px solid var(--l);background:var(--p);color:var(--i);padding:11px 14px;border-radius:9px;cursor:pointer;font:11px monospace}.primary{background:var(--t);color:#03120f;border-color:var(--t)}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px}.msg{min-height:20px;color:var(--r);font-size:12px;margin-top:10px}.fine{color:var(--m);font-size:11px;margin-top:17px}</style></head><body><main class="w"><div class="top"><a class="brand" href="/">ABHINANDAN<b>_</b></a><a href="/admin/login.html">Sign in</a></div><section class="card"><div class="ey">PRIVATE / REGISTRATION</div><h1>Create account.</h1><p class="sub">Registration requests admin access; it does not grant access automatically.</p><form id="form"><div class="f"><label>NAME</label><input id="name" required maxlength="80"></div><div class="f"><label>EMAIL</label><input id="email" type="email" required></div><div class="f"><label>PASSWORD</label><input id="password" type="password" minlength="15" maxlength="128" required></div><div class="f"><label>CONFIRM PASSWORD</label><input id="confirm" type="password" minlength="15" maxlength="128" required></div><div class="actions"><button class="btn primary">REQUEST ACCESS →</button><a class="btn" href="/admin/login.html">LOGIN</a></div><div id="msg" class="msg"></div></form><div class="fine">Use a long passphrase. Passwords are managed by Supabase Auth, not stored in this website.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/auth.js"></script><script>form.onsubmit=e=>{e.preventDefault();signup(name.value,email.value,password.value,confirm.value)}</script></body></html>
