<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Abhinandan</title><link rel="stylesheet" href="/assets/theme-system.css"><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/theme-system.js"></script></head><body><main class="page"><header class="top"><a class="brand" href="/admin/dashboard.html">ABHINANDAN<b>_</b></a><nav class="nav"><a class="btn" href="/admin/dashboard.html">DASHBOARD</a><a class="btn" href="/admin/documents.html">DOCUMENTS</a><a class="btn" href="/admin/queries.html">QUERIES</a><a class="btn" href="/admin/users.html">ADMINS</a><button class="btn" id="logoutBtn">LOGOUT</button></nav></header><section class="card"><div class="ey">ACCOUNT / PROFILE</div><h1 class="title">Profile management.</h1><p class="muted">Update your public-facing account name and contact number. Authentication credentials remain managed by Supabase Auth.</p><form id="form"><div class="grid"><div class="field"><label for="displayName">DISPLAY NAME</label><input class="input" id="displayName" maxlength="80" required></div><div class="field"><label for="phone">PHONE</label><input class="input" id="phone" maxlength="40"></div><div class="field"><label for="email">EMAIL</label><input class="input" id="email" disabled></div><div class="field"><label for="roleStatus">ROLE / STATUS</label><input class="input" id="roleStatus" disabled></div></div><div class="actions"><button class="btn primary" id="save" type="submit">SAVE PROFILE →</button><a class="btn" href="/reset-password.html">CHANGE PASSWORD</a></div><div id="msg" class="msg"></div></form></section><section class="card"><div class="ey">ACCOUNT DETAILS</div><div id="details" class="muted">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/auth.js"></script><script>
const form=document.getElementById('form'),msg=document.getElementById('msg'),details=document.getElementById('details'),displayNameInput=document.getElementById('displayName'),phoneInput=document.getElementById('phone'),emailInput=document.getElementById('email'),roleStatusInput=document.getElementById('roleStatus'),saveBtn=document.getElementById('save');
async function sessionToken(){const result=await sb.auth.getSession();return result.data.session?.access_token||'';}
async function boot(){
  if(!await guard())return;
  const response=await fetch('/api/admin/profile',{headers:{Authorization:`Bearer ${await sessionToken()}`}});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.profile){msg.textContent=data.error||'Unable to load profile.';msg.className='msg error';details.textContent='Unable to load account details.';return;}
  const profile=data.profile;
  displayNameInput.value=profile.display_name||'';phoneInput.value=profile.phone||'';emailInput.value=profile.email||'';roleStatusInput.value=`${String(profile.role||'').toUpperCase()} / ${String(profile.status||'').toUpperCase()}`;
  details.textContent=`Member since ${new Date(profile.created_at).toLocaleString('en-IN')} · Permissions: ${profile.permissions?.join(', ')||'none'}`;
}
form.addEventListener('submit',async event=>{
  event.preventDefault();saveBtn.disabled=true;msg.textContent='Saving…';msg.className='msg';
  try{const response=await fetch('/api/admin/profile',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${await sessionToken()}`},body:JSON.stringify({display_name:displayNameInput.value,phone:phoneInput.value})});const data=await response.json().catch(()=>({}));msg.textContent=data.error||'Profile updated successfully.';msg.className=`msg ${response.ok?'success':'error'}`;if(response.ok)await boot();}catch(error){msg.textContent=error.message||'Unable to update profile.';msg.className='msg error';}finally{saveBtn.disabled=false;}
});
document.getElementById('logoutBtn').onclick=()=>logout();boot();
</script></body></html>
