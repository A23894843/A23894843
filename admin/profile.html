<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Abhinandan</title><link rel="stylesheet" href="/assets/theme-system.css"><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/theme-system.js"></script></head><body><main class="page"><header class="top"><a class="brand" href="/admin/dashboard.html">ABHINANDAN<b>_</b></a><nav class="nav"><a class="btn" href="/admin/dashboard.html">DASHBOARD</a><button class="btn" id="logout">LOGOUT</button></nav></header><section class="card"><div class="ey">ACCOUNT / PROFILE</div><h1 class="title">Profile management.</h1><p class="muted">Update your public-facing account name and contact number. Authentication credentials remain managed by Supabase Auth.</p><form id="form"><div class="grid"><div class="field"><label>DISPLAY NAME</label><input class="input" id="displayName" maxlength="80" required></div><div class="field"><label>PHONE</label><input class="input" id="phone" maxlength="40"></div><div class="field"><label>EMAIL</label><input class="input" id="email" disabled></div><div class="field"><label>ROLE / STATUS</label><input class="input" id="roleStatus" disabled></div></div><div class="actions"><button class="btn primary" id="save">SAVE PROFILE →</button><a class="btn" href="/reset-password.html">CHANGE PASSWORD</a></div><div id="msg" class="msg"></div></form></section><section class="card"><div class="ey">ACCOUNT DETAILS</div><div id="details" class="muted">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/auth.js"></script><script>const f=document.getElementById('form'),msg=document.getElementById('msg');async function boot(){if(!await guard())return;const r=await fetch('/api/admin/profile',{headers:{Authorization:`Bearer ${(await sb.auth.getSession()).data.session?.access_token||''}`}});const d=await r.json();if(!r.ok){msg.textContent=d.error;return}const p=d.profile;displayName.value=p.display_name||'';phone.value=p.phone||'';email.value=p.email||'';roleStatus.value=`${p.role.toUpperCase()} / ${p.status.toUpperCase()}`;details.textContent=`Member since ${new Date(p.created_at).toLocaleString('en-IN')} · Permissions: ${p.permissions?.join(', ')||'none'}`;}f.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Saving…';const s=(await sb.auth.getSession()).data.session;const r=await fetch('/api/admin/profile',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${s?.access_token||''}`},body:JSON.stringify({display_name:displayName.value,phone:phone.value})});const d=await r.json();msg.textContent=d.error||'Profile updated.';msg.className=`msg ${r.ok?'success':'error'}`});logout.onclick=()=>logout();boot();</script></body></html>
