<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | Abhinandan</title>
<style>
:root{--bg:#080b10;--panel:#10151c;--text:#eef4f5;--muted:#8b97a7;--line:#27323e;--t:#42e3c4;--r:#ff7777}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.6 Inter,Arial,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,520px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:0 25px 80px #0005}.eyebrow{font:11px monospace;letter-spacing:.15em;color:var(--muted)}h1{font:600 42px/1 Space Grotesk,Arial,sans-serif;margin:12px 0}.sub{color:var(--muted)}label{display:block;font:11px monospace;color:var(--muted);margin:22px 0 8px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#0b1016;color:var(--text);outline:none}input:focus{border-color:var(--t)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;padding:11px 15px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);text-decoration:none;font:11px monospace;cursor:pointer}.primary{background:var(--t);border-color:var(--t);color:#03120f;font-weight:700}.msg{min-height:24px;margin-top:18px;font:12px monospace;color:var(--r)}.msg.success{color:var(--t)}.fine{margin-top:24px;color:var(--muted);font-size:12px}.footer{margin-top:25px;font:10px monospace;color:var(--muted)}.footer a{color:inherit}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<main class="card">
<div class="eyebrow">PRIVATE / ACCOUNT RECOVERY</div>
<h1>Reset access.</h1>
<p class="sub">Enter your approved admin email. Supabase will send a secure password-reset link.</p>
<form id="form">
<label for="email">EMAIL</label>
<input id="email" type="email" autocomplete="email" required placeholder="admin@example.com">
<div class="actions"><button class="btn primary" id="button" type="submit">SEND RESET LINK →</button><a class="btn" href="/admin/login.html">BACK TO LOGIN</a></div>
<div id="msg" class="msg" aria-live="polite"></div>
</form>
<div class="fine">The reset link returns to <b>/reset-password.html</b>. Configure this URL in Supabase Auth → URL Configuration.</div>
<div class="footer"><a href="https://www.linkedin.com/in/abhinandan-29b66b28b/" target="_blank" rel="noopener noreferrer">LINKEDIN ↗</a> · <a href="/">PORTFOLIO</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/config.js"></script>
<script>
'use strict';
const form=document.getElementById('form'),email=document.getElementById('email'),button=document.getElementById('button'),msg=document.getElementById('msg');
function show(text,ok=false){msg.textContent=text;msg.className='msg'+(ok?' success':'')}
if(typeof SUPABASE_URL==='undefined'||typeof SUPABASE_ANON_KEY==='undefined'||!SUPABASE_URL||!SUPABASE_ANON_KEY){show('Supabase configuration is missing.');}
else {const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='SENDING...';show('');try{const {error}=await client.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:new URL('/reset-password.html',window.location.origin).href});if(error)throw error;show('If the account is eligible, a password reset link has been sent. Check your email.',true);form.reset()}catch(error){show(error.message||'Unable to send reset link.')}finally{button.disabled=false;button.textContent='SEND RESET LINK →'}})}
</script>
</body>
</html>
