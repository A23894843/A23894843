<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | Abhinandan</title>
<style>
:root{--bg:#080b10;--p:#10151c;--i:#eef4f5;--m:#8b97a7;--l:#27313d;--t:#42e3c4;--r:#ff7777}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--i);font:14px/1.6 Arial,sans-serif;display:grid;place-items:center}.w{width:min(calc(100% - 30px),500px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font:600 14px monospace;color:var(--i);text-decoration:none}.brand b{color:var(--t)}.top a:last-child{color:var(--m);text-decoration:none}.card{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:30px}.ey{font:10px monospace;letter-spacing:.15em;color:var(--m)}h1{font:600 40px/1 Arial,sans-serif;margin:10px 0}.sub{color:var(--m)}.field{margin-top:17px}.field label{display:block;font:10px monospace;color:var(--m);margin-bottom:6px}input{width:100%;padding:12px;background:var(--bg);color:var(--i);border:1px solid var(--l);border-radius:9px;outline:none}input:focus{border-color:var(--t)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.btn{border:1px solid var(--l);background:var(--p);color:var(--i);padding:11px 14px;border-radius:9px;cursor:pointer;font:11px monospace;text-decoration:none}.primary{background:var(--t);color:#03120f;border-color:var(--t)}.msg{min-height:22px;margin-top:12px;color:var(--m);font-size:12px}.success{color:var(--t)}.err{color:var(--r)}

/* Theme-safe form controls. The theme is selected only from index.html. */
:root[data-theme="light"] {
    --bg: #f4f7f8;
    --panel: #ffffff;
    --input: #ffffff;
    --input-bg: #ffffff;
    --text: #15202b;
    --muted: #5d6975;
    --border: #d7e0e5;
    --i: #15202b;
    --m: #5d6975;
    --l: #d7e0e5;
    --p: #ffffff;
}

:root[data-theme="light"] input,
:root[data-theme="light"] select,
:root[data-theme="light"] textarea {
    background: #ffffff !important;
    color: #15202b !important;
    border-color: #d7e0e5 !important;
}

:root[data-theme="light"] .card {
    background: #ffffff !important;
    color: #15202b;
    border-color: #d7e0e5;
}
</style>
    <link rel="stylesheet" href="/assets/theme-system.css">
    <script src="/assets/theme-system.js"></script>
</head>
<body>
<main class="w">
<div class="top"><a class="brand" href="/">ABHINANDAN<b>_</b></a> <a href="/admin/login.html">← LOGIN</a></div>
<section class="card">
<div class="ey">PRIVATE / RECOVERY</div>
<h1>Forgot password.</h1>
<p class="sub">Enter the email used for your admin account. Supabase will send a secure recovery link.</p>
<form id="form">
<div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="email" required></div>
<div class="actions"><button id="submit" class="btn primary" type="submit">SEND RESET LINK →</button><a class="btn" href="/admin/login.html">CANCEL</a></div>
<div id="msg" class="msg" aria-live="polite"></div>
</form>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/config.js"></script>
<script src="/admin/auth.js"></script>
<script>
const form=document.getElementById('form'),email=document.getElementById('email'),button=document.getElementById('submit'),msg=document.getElementById('msg');

// Keep this page self-sufficient: recovery must work even if the shared
// auth helper is unavailable due to a stale browser/deployment cache.
if (typeof window.requestPasswordReset !== 'function') {
    window.requestPasswordReset = async function(emailAddress) {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const result = await client.auth.resetPasswordForEmail(
            String(emailAddress || '').trim().toLowerCase(),
            { redirectTo: window.location.origin + '/reset-password.html' }
        );
        if (result.error) throw result.error;
        return true;
    };
}
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';msg.className='msg';button.disabled=true;button.textContent='SENDING...';try{const ok=await requestPasswordReset(email.value);if(!ok)return;msg.textContent='If an account exists for that email, a password reset link has been sent.';msg.className='msg success';email.value='';}catch(error){msg.textContent=error.message||'Unable to send reset link.';msg.className='msg err';}finally{button.disabled=false;button.textContent='SEND RESET LINK →';}});
</script>
</body>
</html>
