<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password — Abhinandan</title><link rel="stylesheet" href="/assets/theme-system.css"><script src="/assets/theme-system.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><script src="/assets/turnstile-config.js"></script><script src="/assets/admin-security.js"></script><style>:root{--bg:#080b10;--panel:#10151c;--text:#eef4f5;--muted:#8b97a7;--border:#27323e;--t:#42e3c4}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.6 Arial,sans-serif;padding:20px}.w{width:min(100%,500px)}.top{display:flex;justify-content:space-between;margin-bottom:18px}.brand{font:600 14px monospace;text-decoration:none}.brand b{color:var(--t)}.top a:last-child{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:30px}.ey{font:10px monospace;letter-spacing:.15em;color:var(--muted)}h1{font:600 40px Arial;margin:10px 0}.sub{color:var(--muted)}.field{margin-top:17px}.field label{display:block;font:10px monospace;color:var(--muted);margin-bottom:6px}input{width:100%;padding:12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:9px}.captcha{margin-top:18px}.captcha-note{color:var(--muted);font:11px monospace;border:1px dashed var(--border);padding:10px;border-radius:9px}.actions{display:flex;gap:8px;margin-top:20px}.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:9px;cursor:pointer;font:11px monospace;text-decoration:none}.primary{background:var(--t);color:#03120f;border-color:var(--t)}.msg{min-height:22px;margin-top:12px;color:var(--muted);font-size:12px}.success{color:var(--t)}</style></head><body><main class="w"><div class="top"><a class="brand" href="/">ABHINANDAN<b>_</b></a><a href="/admin/login.html">← LOGIN</a></div><section class="card"><div class="ey">PRIVATE / RECOVERY</div><h1>Forgot password.</h1><p class="sub">A secure reset link will be sent to the account email.</p><form id="form"><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="email" required></div><div class="captcha" id="captcha" data-turnstile-widget></div><div class="actions"><button id="submit" class="btn primary" type="submit">SEND RESET LINK →</button><a class="btn" href="/admin/login.html">CANCEL</a></div><div id="msg" class="msg" aria-live="polite"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/auth.js"></script><script>const f=document.getElementById('form'),b=document.getElementById('submit'),m=document.getElementById('msg');AdminSecurity.render('captcha','password-reset');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='';b.disabled=true;b.textContent='SENDING...';try{const ok=await requestPasswordReset(email.value,AdminSecurity.getToken());if(ok){m.textContent='If an account exists for that email, a reset link has been sent.';m.className='msg success';f.reset();}}catch(err){m.textContent=err.message||'Unable to send reset link.'}finally{AdminSecurity.reset();b.disabled=false;b.textContent='SEND RESET LINK →';AdminSecurity.render('captcha','password-reset')}});</script></body></html>
