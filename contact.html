<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Abhinandan</title><meta name="description" content="Send a message to Abhinandan."><link rel="stylesheet" href="/assets/theme-system.css"><script src="/assets/theme-system.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><script src="/assets/turnstile-config.js"></script><script src="/assets/admin-security.js"></script><style>body{margin:0;background:#080b10;color:#eef4f5;font:14px/1.6 Inter,Arial,sans-serif}.wrap{width:min(calc(100% - 30px),700px);margin:50px auto}.top{display:flex;justify-content:space-between}.brand{font:600 15px monospace}.brand b{color:#42e3c4}.top a{color:#8b97a7;text-decoration:none}.card{margin-top:22px;background:#10151c;border:1px solid #27323e;border-radius:22px;padding:32px}.ey{font:10px monospace;letter-spacing:.15em;color:#8b97a7}h1{font:600 48px Arial;margin:8px 0}.sub{color:#8b97a7}.field{margin-top:16px}.field label{display:block;color:#8b97a7;font:10px monospace;margin-bottom:6px}.input,.textarea{width:100%;box-sizing:border-box;background:#080b10;color:#eef4f5;border:1px solid #27323e;border-radius:9px;padding:12px}.textarea{min-height:180px;resize:vertical}.captcha{margin-top:18px}.captcha-note{color:#8b97a7;border:1px dashed #27323e;padding:10px;border-radius:9px;font:11px monospace}.actions{margin-top:20px}.btn{display:inline-flex;border:1px solid #27323e;background:#10151c;color:#eef4f5;padding:11px 15px;border-radius:9px;font:11px monospace;text-decoration:none;cursor:pointer}.primary{background:#42e3c4;color:#03120f;border-color:#42e3c4}.msg{margin-top:12px;min-height:22px;color:#8b97a7}.success{color:#42e3c4}.error{color:#ff7777}.hp{position:absolute;left:-10000px}@media(max-width:600px){h1{font-size:40px}.card{padding:22px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/">ABHINANDAN<b>_</b></a><a href="/">← PORTFOLIO</a></header><section class="card"><div class="ey">SECURE CONTACT CHANNEL</div><h1>Send a query.</h1><p class="sub">For internships, collaborations, technical questions or portfolio feedback. Your message is routed to the admin inbox.</p><form id="form"><div class="field"><label>NAME</label><input class="input" id="name" maxlength="100" required></div><div class="field"><label>EMAIL</label><input class="input" id="email" type="email" maxlength="320" required></div><div class="field"><label>SUBJECT</label><input class="input" id="subject" maxlength="160" required></div><div class="field"><label>MESSAGE</label><textarea class="textarea" id="message" maxlength="8000" required></textarea></div><input class="hp" id="website" tabindex="-1" autocomplete="off"><div class="captcha" id="captcha" data-turnstile-widget></div><div class="actions"><button class="btn primary" id="submit">SEND QUERY →</button></div><div class="msg" id="msg" aria-live="polite"></div></form></section></main><script>const f=document.getElementById('form'),b=document.getElementById('submit'),m=document.getElementById('msg');AdminSecurity.render('captcha','contact');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='SENDING...';m.textContent='';try{const r=await fetch('/api/public-query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,subject:subject.value,message:message.value,website:website.value,turnstileToken:AdminSecurity.getToken()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to send query.');m.textContent=d.message||'Query sent.';m.className='msg success';f.reset()}catch(err){m.textContent=err.message||'Unable to send query.';m.className='msg error'}finally{AdminSecurity.reset();b.disabled=false;b.textContent='SEND QUERY →';AdminSecurity.render('captcha','contact')}});</script></body></html>
