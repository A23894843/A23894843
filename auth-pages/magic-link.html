<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Sign In — Abhinandan</title><link rel="stylesheet" href="/auth-pages/auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/auth-pages/auth-common.js"></script></head><body><div class="wrap"><main class="card"><header class="head"><div class="brand">ABHINANDAN_</div><div class="kicker">SECURE ACCESS SYSTEM</div></header><section class="content"><div class="badge">SECURE SIGN-IN</div><h1>Your sign-in link</h1><p>This page completes a passwordless sign-in after you click the secure link delivered to your email.</p><div id="status" class="status hidden"></div><div class="actions"><a id="primaryLink" class="btn primary" href="/">GO TO PORTFOLIO</a><a class="btn secondary" href="/admin/login.html">ADMIN LOGIN</a></div></section><footer class="footer">ABHINANDAN_ · AUTHENTICATION &amp; SECURITY</footer></main></div><script>(async function(){try{const sb=await AuthPage.client();const h=new URLSearchParams(location.hash.slice(1));const err=h.get('error_description')||h.get('error');if(err){AuthPage.setStatus('<strong>Sign-in link failed.</strong><br>'+decodeURIComponent(err.replace(/\+/g,' ')),'error');return}const session=await AuthPage.session(sb);if(session){AuthPage.setStatus('<strong>Signed in successfully.</strong><br>Your secure sign-in link has been accepted.','ok');document.getElementById('primaryLink').textContent='CONTINUE TO PORTFOLIO'}else{AuthPage.setStatus('<strong>Sign-in link not detected.</strong><br>Please request a new sign-in link and try again.','error')}}catch(e){AuthPage.setStatus('<strong>Unable to complete sign-in.</strong><br>'+String(e.message||e),'error')}})();</script></body></html>
