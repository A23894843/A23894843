<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Email — Abhinandan</title><link rel="stylesheet" href="/auth-pages/auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/auth-pages/auth-common.js"></script></head><body><div class="wrap"><main class="card"><header class="head"><div class="brand">ABHINANDAN_</div><div class="kicker">SECURE ACCESS SYSTEM</div></header><section class="content"><div class="badge">EMAIL VERIFICATION</div><h1>Confirm your new email</h1><p>This page completes the email-address verification step for an account email change.</p><div class="status"><strong>Email change verification</strong><br>Processing the verification response...</div><div id="status" class="status hidden"></div><div class="actions"><a id="primaryLink" class="btn primary" href="/">GO TO PORTFOLIO</a><a class="btn secondary" href="/admin/login.html">ADMIN LOGIN</a></div></section><footer class="footer">ABHINANDAN_ · AUTHENTICATION &amp; SECURITY</footer></main></div><script>(async function(){try{const sb=await AuthPage.client();const h=new URLSearchParams(location.hash.slice(1));const err=h.get('error_description')||h.get('error');if(err){AuthPage.setStatus('<strong>Email change failed.</strong><br>'+decodeURIComponent(err.replace(/\+/g,' ')),'error');return}const session=await AuthPage.session(sb);if(session){AuthPage.setStatus('<strong>Email address verified.</strong><br>The email-change verification step has completed.','ok')}else{AuthPage.setStatus('<strong>Verification completed.</strong><br>If your project requires confirmation at both addresses, complete the remaining verification email as well.','ok')}}catch(e){AuthPage.setStatus('<strong>Unable to process email change.</strong><br>'+String(e.message||e),'error')}})();</script></body></html>
