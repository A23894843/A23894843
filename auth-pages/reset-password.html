<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Abhinandan</title><link rel="stylesheet" href="/auth-pages/auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/auth-pages/auth-common.js"></script></head><body><div class="wrap"><main class="card"><header class="head"><div class="brand">ABHINANDAN_</div><div class="kicker">SECURE ACCESS SYSTEM</div></header><section class="content"><div class="badge">PASSWORD RECOVERY</div><h1>Reset your password</h1><p>Create a new password using the secure recovery session from your latest reset email.</p><form id="resetForm"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters" required><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Repeat your password" required><button class="btn primary" type="submit" style="margin-top:18px">UPDATE PASSWORD</button></form><div id="status" class="status hidden"></div><div class="actions"><a id="primaryLink" class="btn primary" href="/">GO TO PORTFOLIO</a><a class="btn secondary" href="/admin/login.html">ADMIN LOGIN</a></div></section><footer class="footer">ABHINANDAN_ · AUTHENTICATION &amp; SECURITY</footer></main></div><script>(async function(){const form=document.getElementById('resetForm');try{const sb=await AuthPage.client();const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);const err=h.get('error_description')||h.get('error');if(err){AuthPage.setStatus('<strong>Password reset link is invalid or expired.</strong><br>'+decodeURIComponent(err.replace(/\+/g,' ')),'error');form.classList.add('hidden');return}let session=await AuthPage.session(sb);if(!session&&q.get('code')){const {error}=await sb.auth.exchangeCodeForSession(q.get('code'));if(error)throw error;session=await AuthPage.session(sb)}if(!session){AuthPage.setStatus('<strong>Recovery session not found.</strong><br>Open the latest password-reset email or request a new one.','error');form.classList.add('hidden');return}form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirmPassword').value;if(p.length<8){AuthPage.setStatus('<strong>Password too short.</strong><br>Use at least 8 characters.','error');return}if(p!==c){AuthPage.setStatus('<strong>Passwords do not match.</strong><br>Please enter the same password twice.','error');return}const {error}=await sb.auth.updateUser({password:p});if(error){AuthPage.setStatus('<strong>Password update failed.</strong><br>'+error.message,'error');return}form.classList.add('hidden');AuthPage.setStatus('<strong>Password updated successfully.</strong><br>Your new password is active.','ok')})}catch(e){AuthPage.setStatus('<strong>Unable to initialize password recovery.</strong><br>'+String(e.message||e),'error');form.classList.add('hidden')}})();</script></body></html>
