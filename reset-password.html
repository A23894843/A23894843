<body>

<main class="w">

<div class="top">
    <a class="brand" href="/">
        ABHINANDAN<b>_</b>
    </a>

    <a href="/admin/login.html">
        ← LOGIN
    </a>
</div>

<section class="card">

<div class="ey">
    PRIVATE / RECOVERY
</div>

<h1>
    Set new password.
</h1>

<p class="sub">
    Choose a new password for your admin account.
    Use at least 15 characters.
</p>

<form id="form" class="hidden">

<div class="field">
    <label>NEW PASSWORD</label>

    <input
        id="password"
        type="password"
        minlength="15"
        autocomplete="new-password"
        required
    >
</div>

<div class="field">
    <label>CONFIRM PASSWORD</label>

    <input
        id="confirmPassword"
        type="password"
        minlength="15"
        autocomplete="new-password"
        required
    >
</div>

<div class="actions">

<button
    class="btn primary"
    type="submit"
>
    UPDATE PASSWORD →
</button>

<a
    class="btn"
    href="/admin/login.html"
>
    CANCEL
</a>

</div>

<div id="msg" class="msg"></div>

</form>

<div id="status" class="msg">
    Verifying recovery link…
</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Keep your existing config.js exactly as it is. -->
<script src="/admin/config.js"></script>

<script>

(function(){

"use strict";

var form =
    document.getElementById("form");

var status =
    document.getElementById("status");

var msg =
    document.getElementById("msg");

var password =
    document.getElementById("password");

var confirmPassword =
    document.getElementById("confirmPassword");


function showStatus(text,type){

    status.textContent = text;

    status.className =
        "msg " + (type || "");

}


function showMessage(text,type){

    msg.textContent = text;

    msg.className =
        "msg " + (type || "");

}


if(
    typeof SUPABASE_URL === "undefined" ||
    typeof SUPABASE_ANON_KEY === "undefined" ||
    !SUPABASE_URL ||
    !SUPABASE_ANON_KEY
){

    showStatus(
        "Supabase configuration is missing.",
        "err"
    );

    return;
}


var client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


var recoveryReady = false;


function markRecoveryReady(messageText) {

    recoveryReady = true;

    form.classList.remove("hidden");

    showStatus(
        messageText ||
        "Recovery link verified. Set your new password.",
        "ok"
    );
}


/*
    Supabase emits PASSWORD_RECOVERY
    when the recovery link establishes
    the recovery session.
*/

client.auth.onAuthStateChange(
    function(event,session){

        if(
            event === "PASSWORD_RECOVERY" &&
            session
        ){

            markRecoveryReady();

        }

    }
);


/*
    Check for an already established
    recovery session.
*/

(async function(){

    try{

        var result =
            await client.auth.getSession();


        if(
            result.error
        ){

            throw result.error;

        }


        if(
            result.data &&
            result.data.session
        ){

            markRecoveryReady(
                "Recovery session detected. Set your new password."
            );

            return;

        }


        /*
            Supabase may still be processing
            the recovery URL.
        */

        var hash =
            window.location.hash || "";

        var query =
            window.location.search || "";


        if(
            hash.indexOf("access_token=") !== -1 ||
            query.indexOf("code=") !== -1
        ){

            showStatus(
                "Finishing recovery sign-in…"
            );


            setTimeout(
                async function(){

                    var retry =
                        await client.auth.getSession();


                    if(
                        retry.data &&
                        retry.data.session
                    ){

                        markRecoveryReady();

                    }
                    else{

                        showStatus(
                            "This recovery link is invalid or expired. Request a new one.",
                            "err"
                        );

                    }

                },
                500
            );

        }
        else{

            showStatus(
                "Open this page using the password-reset link sent to your email.",
                "err"
            );

        }

    }
    catch(error){

        console.error(error);

        showStatus(
            "Unable to verify the recovery link. Request a new reset link.",
            "err"
        );

    }

})();


/*
    Update password
*/

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        showMessage("");


        if(!recoveryReady){

            showMessage(
                "Recovery session is not active. Request a new reset link.",
                "err"
            );

            return;
        }


        if(password.value.length < 15){

            showMessage(
                "Use at least 15 characters.",
                "err"
            );

            return;
        }


        if(
            password.value !==
            confirmPassword.value
        ){

            showMessage(
                "Passwords do not match.",
                "err"
            );

            return;
        }


        try{

            var result =
                await client.auth.updateUser({
                    password:
                        password.value
                });


            if(result.error){

                throw result.error;

            }


            showMessage(
                "Password updated successfully. Redirecting to login…",
                "ok"
            );


            form.reset();


            setTimeout(
                async function(){

                    await client.auth.signOut();

                    window.location.href =
                        "/admin/login.html?reset=success";

                },
                1200
            );

        }
        catch(error){

            console.error(error);

            showMessage(
                error.message ||
                "Unable to update password.",
                "err"
            );

        }

    }
);

})();

</script>

    <script src="/assets/theme-system.js"></script>
</body>
