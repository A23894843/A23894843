name: Update Dynamic Profile Statistics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-profile-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate dynamic GitHub and LeetCode SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          USER = "A23894843"
          LEETCODE = "a23894843"
          OUT = Path("assets/profile-stats")
          OUT.mkdir(parents=True, exist_ok=True)

          def esc(value):
              return html.escape(str(value))

          def badge(filename, label, value, label_width=190, value_width=110):
              width = label_width + value_width
              svg = """<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="34" role="img" aria-label="{aria}">
                <rect width="{width}" height="34" rx="7" fill="#0D1117"/>
                <rect width="{label_width}" height="34" rx="7" fill="#161B22"/>
                <rect x="{label_width}" width="{value_width}" height="34" fill="#39FF14"/>
                <text x="{label_center}" y="22" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">{label}</text>
                <text x="{value_center}" y="22" fill="#0D1117" font-family="Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle">{value}</text>
              </svg>""".format(
                  width=width,
                  aria=esc(f"{label}: {value}"),
                  label_width=label_width,
                  value_width=value_width,
                  label_center=label_width / 2,
                  value_center=label_width + value_width / 2,
                  label=esc(label.upper()),
                  value=esc(value),
              )
              (OUT / filename).write_text(svg, encoding="utf-8")

          def graphql(url, query, variables, headers):
              payload = json.dumps({"query": query, "variables": variables})
              result = subprocess.run(
                  ["curl", "-fsSL"] + headers + [
                      "-H", "Content-Type: application/json",
                      url, "-d", payload
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              return json.loads(result.stdout)

          # GitHub contribution calendar
          now = datetime.now(timezone.utc)
          start = now - timedelta(days=366)

          gh_query = '''
          query($login:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$login) {
              contributionsCollection(from:$from, to:$to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          '''

          gh = graphql(
              "https://api.github.com/graphql",
              gh_query,
              {"login": USER, "from": start.isoformat(), "to": now.isoformat()},
              ["-H", f"Authorization: bearer {os.environ['GH_TOKEN']}"],
          )

          if gh.get("errors"):
              raise RuntimeError(json.dumps(gh["errors"]))

          calendar = gh["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days = [d for week in calendar["weeks"] for d in week["contributionDays"]]
          counts = {d["date"]: int(d["contributionCount"]) for d in days}
          total = int(calendar["totalContributions"])

          # Current streak
          today = now.date()
          cursor = today if counts.get(today.isoformat(), 0) > 0 else today - timedelta(days=1)
          current = 0
          while counts.get(cursor.isoformat(), 0) > 0:
              current += 1
              cursor -= timedelta(days=1)

          # Longest streak
          longest = 0
          running = 0
          previous = None
          for item in sorted(days, key=lambda x: x["date"]):
              d = datetime.strptime(item["date"], "%Y-%m-%d").date()
              if int(item["contributionCount"]) > 0:
                  running = running + 1 if previous == d - timedelta(days=1) else 1
                  longest = max(longest, running)
                  previous = d
              else:
                  running = 0
                  previous = None

          badge("github-contributions.svg", "GitHub Contributions", total)
          badge("current-streak.svg", "Current Streak", f"{current} days")
          badge("longest-streak.svg", "Longest Streak", f"{longest} days")

          # LeetCode public statistics
          lc_query = '''
          query($username:String!) {
            matchedUser(username:$username) {
              username
              submitStatsGlobal {
                acSubmissionNum {
                  difficulty
                  count
                }
              }
            }
          }
          '''

          lc = graphql(
              "https://leetcode.com/graphql",
              lc_query,
              {"username": LEETCODE},
              [
                  "-H", "User-Agent: Mozilla/5.0",
                  "-H", f"Referer: https://leetcode.com/u/{LEETCODE}/",
              ],
          )

          if lc.get("errors") or not lc.get("data", {}).get("matchedUser"):
              raise RuntimeError("Unable to retrieve public LeetCode statistics.")

          stats = {
              x["difficulty"]: int(x["count"])
              for x in lc["data"]["matchedUser"]["submitStatsGlobal"]["acSubmissionNum"]
          }

          badge("leetcode-total.svg", "LeetCode Solved", stats.get("All", 0))
          badge("leetcode-easy.svg", "Easy", stats.get("Easy", 0), 120, 70)
          badge("leetcode-medium.svg", "Medium", stats.get("Medium", 0), 120, 70)
          badge("leetcode-hard.svg", "Hard", stats.get("Hard", 0), 120, 70)

          print(f"GitHub contributions: {total}")
          print(f"Current streak: {current} days")
          print(f"Longest streak: {longest} days")
          print(f"LeetCode solved: {stats.get('All', 0)}")
          PY

      - name: Commit dynamic profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-stats/

          if git diff --cached --quiet; then
            echo "No profile statistic changes."
            exit 0
          fi

          git commit -m "chore: update dynamic profile statistics"
          git push
