name: Update Profile Stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch and update profile statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone

          USER = "A23894843"
          LEETCODE = "a23894843"
          README = "README.md"

          def run_curl(args):
              return subprocess.run(
                  ["curl", "-fsSL"] + args,
                  capture_output=True,
                  text=True,
                  check=True
              ).stdout

          # ---------- GitHub ----------
          now = datetime.now(timezone.utc)
          start = now - timedelta(days=366)

          query = r"""
          query($login:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$login) {
              contributionsCollection(from:$from, to:$to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = {
              "query": query,
              "variables": {
                  "login": USER,
                  "from": start.isoformat(),
                  "to": now.isoformat()
              }
          }

          gh_raw = run_curl([
              "-H", f"Authorization: bearer {os.environ['GH_TOKEN']}",
              "-H", "Content-Type: application/json",
              "https://api.github.com/graphql",
              "-d", json.dumps(payload)
          ])
          gh = json.loads(gh_raw)

          if gh.get("errors"):
              raise RuntimeError(json.dumps(gh["errors"]))

          calendar = gh["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days = [
              day
              for week in calendar["weeks"]
              for day in week["contributionDays"]
          ]

          total_contributions = calendar["totalContributions"]
          counts = {day["date"]: int(day["contributionCount"]) for day in days}

          # Current streak.
          today = now.date()
          cursor = today if counts.get(today.isoformat(), 0) > 0 else today - timedelta(days=1)
          current_streak = 0

          while counts.get(cursor.isoformat(), 0) > 0:
              current_streak += 1
              cursor -= timedelta(days=1)

          # Longest streak in the one-year contribution window.
          longest_streak = 0
          running = 0
          previous = None

          for item in sorted(days, key=lambda x: x["date"]):
              d = datetime.strptime(item["date"], "%Y-%m-%d").date()

              if int(item["contributionCount"]) > 0:
                  running = running + 1 if previous == d - timedelta(days=1) else 1
                  longest_streak = max(longest_streak, running)
                  previous = d
              else:
                  running = 0
                  previous = None

          # ---------- LeetCode ----------
          lc_query = r"""
          query($username:String!) {
            matchedUser(username:$username) {
              username
              submitStatsGlobal {
                acSubmissionNum {
                  difficulty
                  count
                }
              }
              badges {
                name
              }
            }
          }
          """

          lc_raw = run_curl([
              "-H", "Content-Type: application/json",
              "-H", "User-Agent: Mozilla/5.0",
              "-H", f"Referer: https://leetcode.com/u/{LEETCODE}/",
              "https://leetcode.com/graphql",
              "-d", json.dumps({
                  "query": lc_query,
                  "variables": {"username": LEETCODE}
              })
          ])
          lc = json.loads(lc_raw)

          # Retry without badges if LeetCode changes/removes that field.
          if lc.get("errors") or not lc.get("data", {}).get("matchedUser"):
              fallback = r"""
              query($username:String!) {
                matchedUser(username:$username) {
                  username
                  submitStatsGlobal {
                    acSubmissionNum {
                      difficulty
                      count
                    }
                  }
                }
              }
              """
              lc_raw = run_curl([
                  "-H", "Content-Type: application/json",
                  "-H", "User-Agent: Mozilla/5.0",
                  "-H", f"Referer: https://leetcode.com/u/{LEETCODE}/",
                  "https://leetcode.com/graphql",
                  "-d", json.dumps({
                      "query": fallback,
                      "variables": {"username": LEETCODE}
                  })
              ])
              lc = json.loads(lc_raw)

          if lc.get("errors") or not lc.get("data", {}).get("matchedUser"):
              raise RuntimeError("Unable to retrieve public LeetCode statistics.")

          user = lc["data"]["matchedUser"]
          stats = {
              item["difficulty"]: int(item["count"])
              for item in user["submitStatsGlobal"]["acSubmissionNum"]
          }

          lc_total = stats.get("All", 0)
          lc_easy = stats.get("Easy", 0)
          lc_medium = stats.get("Medium", 0)
          lc_hard = stats.get("Hard", 0)

          badge = None
          for item in (user.get("badges") or []):
              name = item.get("name", "")
              if "100 Days Badge" in name:
                  badge = name
                  if str(datetime.now().year) in name:
                      break

          leetcode_label = f"LeetCode-{lc_total}_Solved"
          if badge:
              leetcode_label += f"_·_{badge.replace(' ', '_')}"

          # ---------- README ----------
          text = open(README, encoding="utf-8").read()

          replacements = [
              (
                  r"!\[Contributions\]\([^)]+\)",
                  f"![Contributions](https://img.shields.io/badge/Total_Contributions-{total_contributions}-39FF14?style=for-the-badge&labelColor=0D1117&logo=github&logoColor=39FF14)"
              ),
              (
                  r"!\[Streak\]\([^)]+\)",
                  f"![Streak](https://img.shields.io/badge/Current_Streak-{current_streak}_Days_🔥-FF6B35?style=for-the-badge&labelColor=0D1117)"
              ),
              (
                  r"!\[Longest\]\([^)]+\)",
                  f"![Longest](https://img.shields.io/badge/Longest_Streak-{longest_streak}_Days-7FDBCA?style=for-the-badge&labelColor=0D1117)"
              ),
              (
                  r"!\[LeetCode\]\([^)]+\)",
                  f"![LeetCode](https://img.shields.io/badge/{leetcode_label}-FFA500?style=for-the-badge&labelColor=0D1117&logo=leetcode&logoColor=FFA500)"
              ),
              (
                  r"!\[Easy\]\([^)]+\)",
                  f"![Easy](https://img.shields.io/badge/Easy-{lc_easy}-4ade80?style=flat-square&labelColor=0D1117)"
              ),
              (
                  r"!\[Medium\]\([^)]+\)",
                  f"![Medium](https://img.shields.io/badge/Medium-{lc_medium}-fbbf24?style=flat-square&labelColor=0D1117)"
              ),
              (
                  r"!\[Hard\]\([^)]+\)",
                  f"![Hard](https://img.shields.io/badge/Hard-{lc_hard}-fb7185?style=flat-square&labelColor=0D1117)"
              )
          ]

          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f"README badge not found: {pattern}")

          open(README, "w", encoding="utf-8").write(text)

          print(f"GitHub: {total_contributions} contributions | current {current_streak}d | longest {longest_streak}d")
          print(f"LeetCode: {lc_total} solved | Easy {lc_easy} | Medium {lc_medium} | Hard {lc_hard}")
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "No profile-stat changes."
            exit 0
          fi

          git add README.md
          git commit -m "chore: update profile statistics"
          git push
