name: Update Contribution Chart

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate daily contribution chart
        uses: pipipi-dev/gcchart@v1
        with:
          github_user_name: A23894843
          outputs: |
            contributions-90d.svg?period=90&granularity=day&style=clean&cumulative=false
